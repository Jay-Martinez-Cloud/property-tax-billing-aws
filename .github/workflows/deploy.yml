name: Deploy

on:
  workflow_run: # runs after CI finishes on main
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # or start it manually
    inputs:
      image_tag:
        description: "Image tag (short git SHA). Leave blank for the latest commit on main."
        required: false

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never cancel a deploy halfway through

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: infra/envs/dev
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Plan
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Pick commit and image tag
        id: tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          TAG="${{ inputs.image_tag }}"
          [ -z "$TAG" ] && TAG="${SHA::7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $SHA as image tag $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only CI role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Make sure the image exists in ECR
        run: |
          aws ecr describe-images --repository-name taxbilling-api \
            --image-ids imageTag=${{ steps.tag.outputs.image_tag }} > /dev/null
          echo "✅ Image taxbilling-api:${{ steps.tag.outputs.image_tag }} found"

      - name: Terraform init
        run: terraform -chdir=$TF_DIR init -input=false

      - name: Terraform plan (saved)
        run: |
          set -o pipefail
          terraform -chdir=$TF_DIR plan -input=false -no-color -lock-timeout=120s \
            -var "image_tag=${{ steps.tag.outputs.image_tag }}" -out=tfplan | tee plan.txt

      - name: Show plan in the run summary (for the approver)
        run: |
          {
            echo "## 📋 Plan for image \`${{ steps.tag.outputs.image_tag }}\`"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt
            echo '```'
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    name: Apply (requires approval)
    needs: plan
    runs-on: ubuntu-latest
    environment: production # ⏸️ pauses here until a reviewer approves
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure AWS credentials (deploy role, production environment only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Terraform init
        run: terraform -chdir=$TF_DIR init -input=false

      - name: Terraform apply (exactly the reviewed plan)
        run: terraform -chdir=$TF_DIR apply -input=false tfplan

      - name: Run database migration (one-off ECS task)
        run: |
          NETCFG=$(aws ecs describe-services --cluster taxbilling-dev --services taxbilling-dev-api \
            --query 'services[0].networkConfiguration' --output json)
          TASK_ARN=$(aws ecs run-task --cluster taxbilling-dev --launch-type FARGATE \
            --task-definition taxbilling-dev-api --network-configuration "$NETCFG" \
            --overrides '{"containerOverrides":[{"name":"api","command":["./efbundle"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster taxbilling-dev --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster taxbilling-dev --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT"
          test "$EXIT" = "0"

      - name: Smoke test through the ALB
        run: |
          ALB=$(terraform -chdir=$TF_DIR output -raw alb_url)
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$ALB/health" || true)
            echo "Attempt $i: /health → $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          test "$CODE" = "200"
          curl -fsS "$ALB/bills" | jq .
          echo "### ✅ Deployed \`${{ needs.plan.outputs.image_tag }}\` → $ALB" >> "$GITHUB_STEP_SUMMARY"
