name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege: this workflow only needs to read the code

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate (no backend, no AWS credentials needed)
        run: |
          for dir in infra/modules/network infra/envs/dev infra/ci infra/bootstrap; do
            echo "== $dir"
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

  image:
    name: Build, scan & push image
    needs: [dotnet, terraform] # only runs if tests and Terraform checks pass
    runs-on: ubuntu-24.04-arm # native ARM64 runner, matching Graviton Fargate
    permissions:
      contents: read
      id-token: write # lets this job request a GitHub OIDC token for AWS
    env:
      IMAGE_NAME: taxbilling-api
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag to short git SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "$IMAGE_NAME:$IMAGE_TAG"

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REMOTE="${{ steps.ecr.outputs.registry }}/$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$REMOTE"
          docker push "$REMOTE"
          echo "### 🚀 Pushed \`$REMOTE\`" >> "$GITHUB_STEP_SUMMARY"
